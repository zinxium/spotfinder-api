  /api/places/search/:
    get:
      operationId: api_places_search_retrieve
      description: |-
        Action de recherche avancée pour filtrer les places.

        Paramètres supportés:
        - search: Recherche par nom, ville, adresse ou description
        - budget_min: Budget minimum
        - budget_max: Budget maximum
        - category: Catégorie (restaurant, hôtel, etc.)
        - min_rating: Note minimale
        - city: Nom de la ville
        - page: Numéro de page (défaut: 1)
        - page_size: Nombre de résultats par page (max: 100)

        Exemple: /api/places/search/?search=restaurant&city=Paris&budget_max=50000&min_rating=4
      parameters:
      - in: query
        name: budget_max
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: budget_min
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: min_rating
        schema:
          type: number
          format: double
          maximum: 5
          minimum: 0
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Places
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
          description: ''
