components:
  schemas:
    Category:
      type: object
      description: |-
        Serializer pour convertir les objets Category en JSON et vice-versa.
        Utilisé pour l'API REST.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryEnum:
      enum:
      - restaurant
      - touristique
      - loisir
      - hotel
      - bar
      type: string
      description: |-
        * `restaurant` - Restaurant
        * `touristique` - Site Touristique
        * `loisir` - Loisir
        * `hotel` - Hôtel
        * `bar` - Bar
    Favorite:
      type: object
      description: |-
        Serializer pour les favoris.
        Affiche le nom de la place au lieu de son ID.
      properties:
        id:
          type: integer
          readOnly: true
        place:
          type: integer
        place_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - place
      - place_name
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedFavoriteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
