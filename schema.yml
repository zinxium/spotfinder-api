          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPlace:
      type: object
      description: |-
        Serializer principal pour les places.
        Affiche tous les détails d'une place avec des données calculées.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          nullable: true
          description: Retourne l'URL complète de l'image (avec domaine)
          readOnly: true
        owner_username:
          type: string
          readOnly: true
        reviews_count:
          type: integer
          description: Compte le nombre d'avis de cette place
          readOnly: true
        favorites_count:
          type: integer
          description: Compte le nombre de fois que cette place a été mise en favori
          readOnly: true
        is_favorite:
          type: boolean
          description: Vérifie si l'utilisateur actuel a mis en favori cette place
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        phone_number:
          type: string
          maxLength: 20
        category:
          $ref: '#/components/schemas/CategoryEnum'
        city:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        budget_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        budget_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        rating:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        owner:
          type: integer
          nullable: true
    PatchedReview:
      type: object
      description: |-
        Serializer pour les avis/commentaires.
        Affiche le nom d'utilisateur et l'ID à la place de l'objet User complet.
      properties:
        id:
          type: integer
          readOnly: true
        place:
          type: integer
        user_id:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        rating:
          allOf:
          - $ref: '#/components/schemas/RatingEnum'
