openapi: 3.0.3
info:
  title: SpotFinder API
  version: 1.1.1
  description: API REST pour SpotFinder - Trouvez et partagez vos lieux préférés
  contact:
    name: SpotFinder Support
    email: support@spotfinder.com
  license:
    name: MIT License
paths:
  /:
    get:
      operationId: root_retrieve
      description: Endpoint racine de l'API. Retourne un message de bienvenue et le
        lien vers la documentation.
      tags:
      - Root
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Root'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Se connecter et obtenir les tokens JWT (access + refresh).
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: 'Se déconnecter : révoque le refresh token fourni.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
  /api/auth/password/change/:
    post:
      operationId: api_auth_password_change_create
      description: 'Changer son mot de passe (l''actuel est exigé). Toutes les sessions
        sont révoquées : de nouveaux tokens sont renvoyés pour garder cet appareil
        connecté. Un email d''alerte est envoyé.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: api_auth_password_reset_create
      description: 'Étape 1 : demander un code à 6 chiffres par email. La réponse
        est la même que le compte existe ou non. Limité par adresse IP et par email.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/auth/password/reset/confirm/:
    post:
      operationId: api_auth_password_reset_confirm_create
      description: 'Étape 3 : choisir le nouveau mot de passe avec le jeton de l''étape
        2. Toutes les sessions sont révoquées et un email d''alerte est envoyé.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/auth/password/reset/verify/:
    post:
      operationId: api_auth_password_reset_verify_create
      description: 'Étape 2 : vérifier le code reçu. 5 essais par code, valable 10
        minutes. Renvoie un jeton à usage unique pour l''étape 3.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetToken'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: Échanger un refresh token contre un nouveau couple access/refresh.
        L'ancien refresh token est révoqué.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: Créer un nouvel utilisateur et obtenir ses tokens JWT (access +
        refresh).
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          description: No response body
