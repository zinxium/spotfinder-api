components:
  schemas:
    AuthResponse:
      type: object
      description: 'Réponse de connexion/inscription : utilisateur + tokens JWT'
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
      - user
    Category:
      type: object
      description: |-
        Serializer pour convertir les objets Category en JSON et vice-versa.
        Utilisé pour l'API REST.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryEnum:
      enum:
      - restaurant
      - touristique
      - loisir
      - hotel
      - bar
      type: string
      description: |-
        * `restaurant` - Restaurant
        * `touristique` - Site Touristique
        * `loisir` - Loisir
        * `hotel` - Hôtel
        * `bar` - Bar
    Detail:
      type: object
      description: Réponse contenant seulement un message
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    Favorite:
      type: object
      description: |-
        Serializer pour les favoris.
        Renvoie l'ID du lieu (utilisé à la création), son nom, et son détail complet.
      properties:
        id:
          type: integer
          readOnly: true
        place:
          type: integer
        place_name:
          type: string
          readOnly: true
        place_details:
          allOf:
          - $ref: '#/components/schemas/Place'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - place
      - place_details
      - place_name
    Login:
      type: object
      description: Serializer pour la connexion
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      description: Serializer pour la déconnexion (révoque le refresh token)
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedFavoriteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'
    PaginatedPlaceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
