        results:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
    PasswordChange:
      type: object
      description: 'Changement de mot de passe d''un utilisateur connecté : l''actuel
        est exigé'
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    PasswordResetConfirm:
      type: object
      description: 'Étape 3 : le jeton et le nouveau mot de passe'
      properties:
        reset_token:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - reset_token
    PasswordResetRequest:
      type: object
      description: 'Étape 1 du mot de passe oublié : l''email du compte'
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetToken:
      type: object
      description: 'Réponse de l''étape 2 : jeton à usage unique pour l''étape 3'
      properties:
        reset_token:
          type: string
          readOnly: true
      required:
      - reset_token
    PasswordResetVerify:
      type: object
      description: 'Étape 2 : l''email et le code à 6 chiffres reçu'
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
      - email
    PatchedCategory:
      type: object
      description: |-
        Serializer pour convertir les objets Category en JSON et vice-versa.
        Utilisé pour l'API REST.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedFavorite:
      type: object
      description: |-
        Serializer pour les favoris.
        Renvoie l'ID du lieu (utilisé à la création), son nom, et son détail complet.
      properties:
        id:
          type: integer
          readOnly: true
