openapi: 3.0.3
info:
  title: Spotfinder API
  version: 1.0.0
  description: API REST pour découvrir et gérer des lieux
paths:
  /:
    get:
      operationId: root_retrieve
      description: Endpoint racine de l'API. Retourne un message de bienvenue et le
        lien vers la documentation.
      tags:
      - Root
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Se connecter et obtenir un token d'authentification.
      tags:
      - Authentication
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              username:
                type: string
              password:
                type: string
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Se déconnecter et supprimer le token d'authentification.
      tags:
      - Authentication
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: Créer un nouvel utilisateur et obtenir un token d'authentification.
      tags:
      - Authentication
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              username:
                type: string
              email:
                type: string
              password:
                type: string
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: ''
  /api/categories/:
    get:
      operationId: api_categories_list
      description: |-
        ViewSet pour gérer les catégories.
        Liste complète des opérations CRUD.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
